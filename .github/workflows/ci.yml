name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # --passWithNoTests is required while the repo has zero test files.
      # Drop it once real tests exist.
      - name: Test
        run: npx jest --passWithNoTests --ci

      - name: Expo Doctor
        run: npx expo-doctor
